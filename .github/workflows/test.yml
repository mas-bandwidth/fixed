# CI for the fixed-point library. The determinism tests assert FROZEN hashes,
# so every OS and toolchain in the matrix must produce bit-identical results —
# cross-platform determinism is ENFORCED here, not merely hoped for. The
# negative-control tests (WILL_FAIL) prove the suites detect breakage.
#
# WINDOWS IS BUILT TWICE, and the second build is the point of the matrix:
#
#   ClangCL      — the compiler has __int128, so fixInt128 is the native type.
#   MSVC (plain) — no __int128, so fixInt128 is the emulated pair in
#                  include/fixed/fixed_int128.h. This arm asserts THE SAME
#                  FROZEN HASHES, which is what makes "the emulation is
#                  bit-identical to native" a checked guarantee rather than a
#                  claim. Visual C++ support is a hard requirement here.
#
# Every arm also runs the whole suite a second time against fixed_emulated (the
# library compiled with FIX_FORCE_EMULATED_INT128), so the emulated path is
# exercised on Linux and macOS too rather than only on the one runner that needs it.
name: test
on: [push, pull_request]
jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            os: ubuntu-latest
            configure: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFIX_BUILD_BENCHMARKS=ON
          - name: ubuntu-arm64
            os: ubuntu-24.04-arm
            configure: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFIX_BUILD_BENCHMARKS=ON
          - name: macos
            os: macos-latest
            configure: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFIX_BUILD_BENCHMARKS=ON
          - name: windows-clangcl
            os: windows-latest
            configure: cmake -S . -B build -T ClangCL -DFIX_BUILD_BENCHMARKS=ON
          - name: windows-msvc
            os: windows-latest
            configure: cmake -S . -B build -DFIX_BUILD_BENCHMARKS=ON
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: ${{ matrix.configure }}
      # --parallel matters more than it looks: the suite is ~20 small independent
      # targets, and MSBuild builds them one at a time by default. Measured on the
      # plain-MSVC arm, that step alone was 121s of a 2m19s job, over Glenn's
      # one-to-two-minute rule on its own.
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      # The runtime ISA dispatch, printed: the host's facts, the default variant, and a
      # VARIANT line per variant (RAN, or SKIP with the reason). ctest already ran it; this
      # step is the record of what each runner selected.
      - name: ISA dispatch variants
        shell: bash
        run: |
          t=build/fixed_isa_dispatch_test
          [ -x "$t" ] || t=build/Release/fixed_isa_dispatch_test.exe
          "$t" 1000000

  # THE AVX-512 VARIANT ON A RUNNER THAT MAY LACK AVX-512, and the baseline on one that
  # certainly does. Intel SDE emulates a Sapphire Rapids (-spr: AVX-512F/DQ and the OS zmm
  # state) and a Haswell (-hsw: AVX2, no AVX-512). The same binary must run avx512 against
  # scalar bit for bit on the first, and must select scalar and refuse FIXED_ISA=avx512 by
  # name on the second. Also checks that no AVX-512 or AVX instruction reached a baseline
  # object: only src/fixed_isa_avx512.c may contain one.
  #
  # Intel's SDE download can refuse a runner (HTTP 403 on 2026-10-15). Then the SDE steps
  # say so and skip, and the runner's own CPU is the check instead: if it has AVX-512 the
  # avx512 variant must RUN natively. A runner with neither fails the job.
  isa-x86:
    name: isa-x86 (SDE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: petarpetrovt/setup-sde@v2.4
        id: sde
        continue-on-error: true
        with:
          environmentVariableName: SDE_PATH
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFIX_BUILD_BENCHMARKS=ON
          cmake --build build --parallel --target fixed_isa_dispatch_test fixed_op_bench
      - name: No wide instruction outside the variant TU
        run: |
          for o in fixed_math fixed_vec fixed_isa; do
            if objdump -d --no-show-raw-insn "build/CMakeFiles/fixed.dir/src/$o.c.o" | grep -E '%(zmm|ymm)|%k[0-7]'; then
              echo "wide instruction in baseline object $o"; exit 1
            fi
          done
          objdump -d --no-show-raw-insn build/CMakeFiles/fixed.dir/src/fixed_isa_avx512.c.o | grep -q zmm
      - name: AVX-512 on the runner itself, when SDE is unavailable
        if: steps.sde.outcome != 'success'
        run: |
          echo "SDE unavailable on this runner; checking the native CPU instead"
          grep -qw avx512dq /proc/cpuinfo || { echo "no SDE and no AVX-512 on this runner: avx512 unchecked"; exit 1; }
          build/fixed_isa_dispatch_test 1000000 | tee native.txt
          grep -q '^VARIANT avx512 RAN' native.txt
          build/fixed_op_bench 1 10 fixMul | head -1 | grep '^# isa: avx512'
      - name: AVX-512 emulated (Sapphire Rapids)
        if: steps.sde.outcome == 'success'
        run: |
          "$SDE_PATH/sde64" -spr -- build/fixed_isa_dispatch_test 200000 | tee spr.txt
          grep -q '^VARIANT avx512 RAN' spr.txt
          "$SDE_PATH/sde64" -spr -- build/fixed_op_bench 1 10 fixMul | head -1 | grep '^# isa: avx512'
      - name: No AVX-512 (Haswell) selects scalar
        if: steps.sde.outcome == 'success'
        run: |
          "$SDE_PATH/sde64" -hsw -- build/fixed_isa_dispatch_test 200000 | tee hsw.txt
          grep -q '^VARIANT avx512 SKIP host lacks' hsw.txt
          "$SDE_PATH/sde64" -hsw -- build/fixed_op_bench 1 10 fixMul | head -1 | grep '^# isa: scalar'
          if FIXED_ISA=avx512 "$SDE_PATH/sde64" -hsw -- build/fixed_op_bench 1 10 fixMul; then
            echo "FIXED_ISA=avx512 was not refused on a host without AVX-512"; exit 1
          fi

  # Undefined behavior is how "bit-identical" dies quietly: a signed-overflow
  # or negative-shift that happens to agree today diverges on the next
  # compiler. UBSan enforces that the library and its tests contain none —
  # on both 128-bit arms, because the emulated pair does its own lane shifting
  # and is exactly the kind of code that gets a shift count wrong.
  ubsan:
    name: ubsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run under UBSan
        run: |
          for t in determinism_test transcendental_test exhaustive_test wide_time_test port_equality_test int128_test quantize_test geometry_test aabb_test usage_test inverse_envelope_test int256_division_test numerical_regression_test; do
            for arm in "" "-DFIX_FORCE_EMULATED_INT128"; do
              clang -O2 -fsanitize=undefined -fno-sanitize-recover=all $arm \
                -I include "test/$t.c" src/*.c -lm -o "/tmp/$t"
              "/tmp/$t"
            done
          done
          for arm in "" "-DFIX_FORCE_EMULATED_INT128"; do
            clang -O2 -fsanitize=undefined -fno-sanitize-recover=all $arm \
              -I include test/isa_dispatch_test.c benchmark/oracle.c src/*.c -lm -o /tmp/isa_dispatch_test
            /tmp/isa_dispatch_test 1000000
            clang -O2 -fsanitize=undefined -fno-sanitize-recover=all $arm \
              -I include test/batch_test.c src/*.c -lm -o /tmp/batch_test
            /tmp/batch_test 1000000
          done
          for arm in "" "-DFIX_FORCE_EMULATED_INT128"; do
            clang -O2 -DFIX_SATURATE -fsanitize=undefined -fno-sanitize-recover=all $arm \
              -I include test/numerical_regression_test.c src/*.c -lm -o /tmp/numerical_saturated_test
            /tmp/numerical_saturated_test
          done
